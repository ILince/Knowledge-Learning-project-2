security:
    # Password hashers configuration
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # User provider configuration
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username  # Or 'email' if you prefer email-based authentication

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider  # Make sure this matches the name of your provider
            custom_authenticator: App\Security\AppCustomAuthenticator
            logout:
                path: app_logout
                # Optionally, add a target redirect here after logout
                # target: app_any_route

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                # If you want the "remember me" checkbox to be always checked, uncomment:
                # always_remember_me: true

            # Other firewall settings...
    
    # Access control settings
    access_control:
        # Example: Restrict access to /admin to ROLE_ADMIN users
        # - { path: ^/admin, roles: ROLE_ADMIN }
        # Example: Allow all logged in users access to profile page
        # - { path: ^/profile, roles: ROLE_USER }



when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
